name: Build MDS Hitung Dzikir

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          mkdir buildsrc
          unzip -q MDS-Hitung-Dzikir-v1.0-build-cloud.zip -d buildsrc
          cd buildsrc
          echo "Project extracted successfully"
          ls -la

      - name: Build APK
        working-directory: buildsrc
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MDS-Hitung-Dzikir-debug
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
